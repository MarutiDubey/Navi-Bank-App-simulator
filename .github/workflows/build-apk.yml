name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # Allow manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ─────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Install NPM dependencies ───────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build React (Vite) app ─────────────────────────────────────────
      - name: Build React app
        run: npm run build

      # ── 5. Setup Java (required by Gradle / Android SDK) ──────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 6. Setup Android SDK ─────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 7. Install Android build tools & platform ──────────────────────────
      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      # ── 8. Sync Capacitor & copy web assets to Android ────────────────────
      - name: Sync Capacitor Android
        run: npx cap sync android

      # ── 9. Grant Gradle wrapper permissions ───────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 10. Build debug APK ───────────────────────────────────────────────
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 11. Upload APK artifact ───────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: navi-bank-simulator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 12. Print download instructions ───────────────────────────────────
      - name: Build Success
        run: |
          echo "✅ APK built successfully!"
          echo "📱 Download from: Actions → This Run → Artifacts → navi-bank-simulator-apk"
